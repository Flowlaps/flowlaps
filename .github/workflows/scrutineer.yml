name: Scrutineer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Scrutineer review
        run: npx @flowlaps/scrutineer@latest review --diff origin/main --pr ${{ github.event.pull_request.number }} --provider openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.FLOWLAPS_REVIEWER_TOKEN }}
          SCRUTINEER_MODEL_OPENAI: gpt-4o
